worker_processes  1;
events {
    worker_connections  1024;
}
http {
    server_names_hash_bucket_size 64;
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    
    # Main server block for dev.aitoolsuite.xyz only
    server {
        listen       80;
        server_name  <subdomain.domain.xyz>;
        
        # Serve React frontend
        location / {
            root   <Path to React build file>;
            index  index.html;
            try_files $uri /index.html;
        }
        
        # Serve static assets like JS/CSS from React build
        location /static/ {
            root   <Path to React build file>;
        }
        
        # Reverse proxy for DRF backend
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        
        location /media/ {
            alias <Path to Django Media file>;
        }
    }

    # Server block for user1 <Auto created by DRF backend>
    server {
        listen       80;
        server_name  <subsubdomain.subdomain.domain.xyz>;
        
        # Proxy all requests to the Streamlit container
        location / {
            proxy_pass         http://127.0.0.1:8921;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Port $server_port;
            
            # WebSocket support for Streamlit
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        # Handle Streamlit's static files
        location /_stcore/static/ {
            proxy_pass         http://127.0.0.1:8921;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        
        # Handle Streamlit's health check
        location /healthz {
            proxy_pass         http://127.0.0.1:8921;
            proxy_set_header   Host $host;
        }
    }
}