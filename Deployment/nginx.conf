worker_processes  1;
events {
    worker_connections  1024;
}
http {
    server_names_hash_bucket_size 128;
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    
    # Server block for user1
    server {
        listen       80;
        server_name  user1.subdomain.domain.xyz;
        
        # Handle Streamlit's core static files and API endpoints
        location /_stcore/ {
            proxy_pass         http://127.0.0.1:8881;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Port $server_port;
            
            # WebSocket support for Streamlit
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        # Handle legacy static files (redirect to _stcore)
        location /static/ {
            proxy_pass         http://127.0.0.1:8881/_stcore/static/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        
        # Handle Streamlit's health check
        location /healthz {
            proxy_pass         http://127.0.0.1:8881;
            proxy_set_header   Host $host;
        }
        
        # Handle Streamlit's health check (alternative path)
        location /_stcore/health {
            proxy_pass         http://127.0.0.1:8881;
            proxy_set_header   Host $host;
        }
        
        # Handle allowed message origins
        location /_stcore/allowed-message-origins {
            proxy_pass         http://127.0.0.1:8881;
            proxy_set_header   Host $host;
        }
        
        # Handle vendor files
        location /vendor/ {
            proxy_pass         http://127.0.0.1:8881;
            proxy_set_header   Host $host;
        }
        
        # Proxy all other requests to the Streamlit container
        location / {
            proxy_pass         http://127.0.0.1:8881;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Port $server_port;
            
            # WebSocket support for Streamlit
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }

    # Main server block for subdomain.domain.xyz only
    server {
        listen       80;
        server_name  subdomain.domain.xyz;
        
        # Serve React frontend
        location / {
            root  <Path to /react-frontend/build;
            index  index.html;
            try_files $uri /index.html;
        }
        
        # Serve static assets like JS/CSS from React build
        location /static/ {
            root  <Path to /react-frontend/build;
        }
        
        # Reverse proxy for DRF backend
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        
        location /media/ {
            alias<Path to /Django-backend/media/;
        }
    }
}